[workspace]
resolver = "2"
members = ["crates/pos-core", "crates/pos-dev", "src-tauri"]
default-members = ["crates/pos-core", "crates/pos-dev"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

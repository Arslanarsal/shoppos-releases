[package]
name = "shoppos"
version = "0.1.0"
edition = "2021"
description = "ShopPOS offline shop inventory and point of sale"

[lib]
name = "shoppos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pos-core = { path = "../crates/pos-core" }
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
percent-encoding = "2"
chrono.workspace = true
